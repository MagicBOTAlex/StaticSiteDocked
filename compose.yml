version: '3.8'

services:
  zcollection:
    image: docker.deprived.dev/static-site
    container_name: zcollection-demo
    stdin_open: true   
    tty: true          
    environment:
      REPO_URL: "https://github.com/MagicBOTAlex/ZCollection"
      BRANCH: "master"
      # GITHUB_TOKEN: "" # Optional: token for private repos / auth on pull
      # FRESH_PULL
      # - NIX_RUN: "build-run" # Not supported lol
    ports:
      - 7577:4173
    volumes:
      - nix-cache:/nix
      - node_modules:/node_modules

volumes:
  nix-cache:
  node_modules:
